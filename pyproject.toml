[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytech"
version = "0.1.0"
description = "Bibliothèque scientifique et de calcul formel/numérique pour les matières de sciences appliquées et de l'ingénieur"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",
    "pymupdf4llm>=0.0.17",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 88
# Le corpus converti n'est pas du code : c'est la transcription fidele de
# sources, qu'`AGENTS.md` interdit de toucher par sa premiere regle.
#
# Ruff 0.16 formate le Python des blocs Markdown. Il voulait donc reecrire
# `signaux_systemes_commande_exemples.md`, transcription d'un carnet Jupyter
# -- et une transcription reformatee n'est plus une transcription. Les trois
# racines du corpus lui sont donc fermees.
exclude = ["cours-markdown", "cours-latex", "transcriptions"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213", "COM812",
  # RUF001-003 : les identifiants et docstrings sont en francais (langage
  # ubiquitaire du cours) ; les caracteres accentues y sont voulus.
  "RUF001", "RUF002", "RUF003",
  # CPY001 : exercice academique, pas d'en-tete de copyright a porter.
  "CPY001",
  # D401 : l'heuristique de "mode imperatif" de ruff est anglophone et
  # classe a tort toute docstring francaise ; le mode imperatif francais
  # est respecte a la lecture.
  "D401",
  # N818 : le suffixe "Error" est une convention anglaise ; les exceptions
  # du domaine portent le vocabulaire francais du cours.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# Les quatre exemptions des tests, justifiees comme toutes les autres :
#   S101   : `assert` est le mecanisme meme de pytest.
#   PLR2004: une valeur attendue litterale est le propos d'un test ; la
#            nommer en constante eloignerait l'attendu de l'assertion.
#   D100   : le nom du fichier de test dit deja ce qu'il couvre.
#   D103   : un nom de test est une phrase francaise complete
#            (`test_le_parement_vertical_integre_en_un_demi_rho_g_l_h_carre`) ;
#            exiger en plus une docstring ferait redire la meme chose. Les
#            tests dont le *pourquoi* ne se lit pas dans le nom en portent
#            une, et c'est la regle observee dans ce depot.
"tests/*" = ["S101", "PLR2004", "D100", "D103"]
# Un script de `travaux/` est autonome : le corrige l'inclut tel quel et
# un test l'execute par son chemin. Ce n'est pas un paquet, et son
# dossier -- `lab-01`, au nom du document qu'il resout -- ne pourrait
# pas en etre un : un tiret n'entre pas dans un nom de module.
"travaux/*/*/*.py" = ["INP001"]
# Code importé depuis le solveur de recherche opérationnelle ORSolver (UMons)
"polytech/optimisation/orsolver/**" = ["ALL"]
"polytech/optimisation/core/**" = ["ALL"]
"polytech/optimisation/lp/**" = ["ALL"]
"polytech/optimisation/mip/**" = ["ALL"]
"polytech/optimisation/transport/**" = ["ALL"]
"polytech/optimisation/network/**" = ["ALL"]
"polytech/optimisation/game_theory/**" = ["ALL"]
"polytech/optimisation/mdp/**" = ["ALL"]
"polytech/optimisation/mcda/**" = ["ALL"]
"polytech/optimisation/decision/**" = ["ALL"]
"polytech/optimisation/reliability/**" = ["ALL"]
"polytech/optimisation/dynamic_programming/**" = ["ALL"]
"polytech/optimisation/simulation/**" = ["ALL"]
"polytech/optimisation/queuing/**" = ["ALL"]
"polytech/optimisation/inventory/**" = ["ALL"]
"polytech/optimisation/heuristics/**" = ["ALL"]
"polytech/optimisation/nlp/**" = ["ALL"]
"polytech/optimisation/visualizer/**" = ["ALL"]
"polytech/optimisation/cli/**" = ["ALL"]
"polytech/optimisation/legacy.py" = ["ALL"]
"tests/orsolver/**" = ["ALL"]

[tool.mypy]
strict = true
warn_unreachable = true

# sympy, mpmath et scipy n'exposent ni stubs ni marqueur py.typed. scipy
# sert au seul TP de signaux, dont l'enonce impose `scipy.signal`. mpmath est
# livre avec sympy, et sert aux deux recoupements numeriques du corps
# noir ; l'ecart reste circonscrit a ces paquets tiers, et le code de la
# bibliotheque demeure en mode strict.
[[tool.mypy.overrides]]
module = ["sympy.*", "mpmath.*", "pymupdf.*", "pymupdf4llm.*", "scipy.*"]
ignore_missing_imports = true

# LatexPrinter n'est pas annote en amont : heriter d'un `Any` est le seul
# moyen d'etendre l'imprimeur de sympy. L'ecart tient a ce seul module.
[[tool.mypy.overrides]]
module = "polytech.fluides.application.impression"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "polytech.optimisation.orsolver.*",
    "polytech.optimisation.core.*",
    "polytech.optimisation.lp.*",
    "polytech.optimisation.mip.*",
    "polytech.optimisation.transport.*",
    "polytech.optimisation.network.*",
    "polytech.optimisation.game_theory.*",
    "polytech.optimisation.mdp.*",
    "polytech.optimisation.mcda.*",
    "polytech.optimisation.decision.*",
    "polytech.optimisation.reliability.*",
    "polytech.optimisation.dynamic_programming.*",
    "polytech.optimisation.simulation.*",
    "polytech.optimisation.queuing.*",
    "polytech.optimisation.inventory.*",
    "polytech.optimisation.heuristics.*",
    "polytech.optimisation.nlp.*",
    "polytech.optimisation.visualizer.*",
    "polytech.optimisation.cli.*",
    "polytech.optimisation.legacy",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
